[workspace]
members = [
  "crates/api",
  "crates/authoring",
  "crates/cli",
  "crates/types",
  "crates/capabilities",
  "crates/crypto",
  "crates/discovery",
  "crates/identity",
  "crates/object",
  "crates/personalization",
  "crates/graph",
  "crates/hashgraph",
  "crates/eval",
  "crates/sim",
  "crates/judgment",
  "crates/judgment-jev",
  "crates/judgment-local",
  "crates/judgment-python",
  "crates/lens",
  "crates/media",
  "crates/network",
  "crates/node",
  "crates/realtime",
  "crates/rpc",
  "crates/runtime",
  "crates/schema",
  "crates/state",
  "crates/store",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/saint/babel-protocol"
rust-version = "1.92"

[workspace.dependencies]
babel-api = { path = "crates/api" }
babel-authoring = { path = "crates/authoring" }
babel-cli = { path = "crates/cli" }
babel-capabilities = { path = "crates/capabilities" }
babel-crypto = { path = "crates/crypto" }
babel-discovery = { path = "crates/discovery" }
babel-eval = { path = "crates/eval" }
babel-graph = { path = "crates/graph" }
babel-hashgraph = { path = "crates/hashgraph" }
babel-identity = { path = "crates/identity" }
babel-judgment = { path = "crates/judgment" }
babel-judgment-jev = { path = "crates/judgment-jev" }
babel-judgment-local = { path = "crates/judgment-local" }
babel-judgment-python = { path = "crates/judgment-python" }
babel-lens = { path = "crates/lens" }
babel-media = { path = "crates/media" }
babel-network = { path = "crates/network" }
babel-node = { path = "crates/node" }
babel-object = { path = "crates/object" }
babel-personalization = { path = "crates/personalization" }
babel-realtime = { path = "crates/realtime" }
babel-rpc = { path = "crates/rpc" }
babel-runtime = { path = "crates/runtime" }
babel-schema = { path = "crates/schema" }
babel-sim = { path = "crates/sim" }
babel-state = { path = "crates/state" }
babel-store = { path = "crates/store" }
babel-types = { path = "crates/types" }

blake3 = "1.8.2"
axum = "0.8.4"
chacha20poly1305 = "0.10.1"
ed25519-dalek = { version = "2.2.0", features = ["rand_core", "serde"] }
hex = "0.4.3"
rand_core = { version = "0.6.4", features = ["getrandom"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.145", features = ["preserve_order", "float_roundtrip"] }
schemars = { version = "1.2.2", features = ["preserve_order"] }
reqwest = { version = "0.12.24", default-features = false, features = ["blocking", "json", "rustls-tls"] }
thiserror = "2.0.17"
time = { version = "0.3.44", features = ["serde", "formatting", "parsing"] }
tokio = { version = "1.48.0", features = ["macros", "rt-multi-thread"] }
tower = { version = "0.5.2", features = ["util"] }
tower-http = { version = "0.6.6", features = ["cors"] }
zeroize = { version = "1.8.2", features = ["derive"] }
